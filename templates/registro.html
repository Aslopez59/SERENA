{% extends "base.html" %}

{% block content %}
<section class="card">
  <h2>Registro de estudiante</h2>

  {% if errores %}
    <div class="errores">
      <ul>
        {% for error in errores %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}

  <form method="post" action="/registro">
    <label for="nombres">Nombres completos</label>
    <input type="text" id="nombres" name="nombres" value="{{ form_data.get('nombres', '') }}" required>

    <label for="correo">Correo institucional</label>
    <input type="email" id="correo" name="correo" value="{{ form_data.get('correo', '') }}" required placeholder="usuario@ucatolica.edu.co">

    <label for="carrera">Carrera</label>
    <select id="carrera" name="carrera" required>
      <option value="">Seleccione una carrera</option>
      {% for carrera in carreras %}
        <option value="{{ carrera }}" {% if form_data.get('carrera') == carrera %}selected{% endif %}>{{ carrera }}</option>
      {% endfor %}
    </select>

    <label for="semestre">Semestre</label>
    <select id="semestre" name="semestre" required>
      <option value="">Seleccione semestre</option>
      {% for semestre in semestres %}
        <option value="{{ semestre }}" {% if form_data.get('semestre') == semestre|string %}selected{% endif %}>{{ semestre }}</option>
      {% endfor %}
    </select>

    <label for="cedula">Número de cédula</label>
    <input type="text" id="cedula" name="cedula" value="{{ form_data.get('cedula', '') }}" required>

    <label for="celular">Celular</label>
    <input type="text" id="celular" name="celular" value="{{ form_data.get('celular', '') }}" required minlength="3" maxlength="10">

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required minlength="4">

    <button type="submit">Registrarme</button>
  </form>
</section>
{% endblock %}
